<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>skzlx.com</title>
  <meta name="description" content="skzlx.com" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#000000" />
  <link rel="canonical" href="https://skzlx.com/" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://skzlx.com/" />
  <meta property="og:title" content="skzlx.com" />
  <meta property="og:description" content="skzlx.com" />
  <meta property="og:video" content="https://skzlx.com/K65J0P9HHJ.mp4" />
  <meta property="og:video:type" content="video/mp4" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>
<body>
  <video
    id="v"
    src="K65J0P9HHJ.mp4"
    autoplay
    loop
    playsinline
    webkit-playsinline
    disablepicturepicture
    disableRemotePlayback
    preload="auto"
  ></video>

  <script>
    (function () {
      var v = document.getElementById("v");
      if (!v) return;

      var userUnlockedAudio = false;

      v.loop = true;
      v.controls = false;
      v.volume = 1.0;

      function tryPlay(withSound) {
        v.muted = !withSound;
        var p = v.play();
        if (p && p.catch) {
          p.catch(function () {
            if (withSound && !userUnlockedAudio) {
              v.muted = true;
              var fallback = v.play();
              if (fallback && fallback.catch) {
                fallback.catch(function () {});
              }
            }
          });
        }
      }

      function unlockAndSyncAudio() {
        userUnlockedAudio = true;
        v.muted = false;
        v.volume = 1.0;
        if (v.paused) {
          v.currentTime = 0;
        }
        tryPlay(true);
      }

      // Attempt unmuted autoplay first; fall back to muted if blocked
      tryPlay(true);

      v.addEventListener("pause", function () {
        tryPlay(userUnlockedAudio);
      });

      v.addEventListener("ended", function () {
        v.currentTime = 0;
        tryPlay(userUnlockedAudio);
      });

      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) {
          tryPlay(userUnlockedAudio);
        }
      });

      window.addEventListener("pageshow", function () {
        tryPlay(userUnlockedAudio);
      });

      window.addEventListener("focus", function () {
        tryPlay(userUnlockedAudio);
      });

      ["pointerdown", "touchstart", "click", "keydown"].forEach(function (ev) {
        document.addEventListener(ev, unlockAndSyncAudio, { passive: true });
      });
    })();
  </script>
</body>
</html>
